<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:cmp="jakarta.faces.composite/components"
                xmlns:p="http://primefaces.org/ui">

    <div class="detail-badge-row">
        <span class="badge-pill badge-muted">ID: #{professorBean.detalheProfessor.id}</span>
        <span class="badge-pill badge-muted">RM: #{professorBean.detalheProfessor.rm}</span>
    </div>

    <div class="field-group">
        <h:panelGrid columns="1" cellpadding="7">
            <cmp:baseInput id="detalheProfessorNome" value="#{professorBean.detalheEdicao.nome}" label="Nome Completo"
                           styleClass="form-control" style="text-transform: uppercase;" required="true"
                           requiredMessage="Nome e obrigatorio." disabled="#{not professorBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfessorCpf" value="#{professorBean.detalheEdicao.cpf}" label="CPF"
                           styleClass="form-control" style="text-transform: uppercase;" required="true"
                           requiredMessage="CPF e obrigatorio." disabled="#{not professorBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfessorRg" value="#{professorBean.detalheEdicao.rg}" label="RG"
                           styleClass="form-control" style="text-transform: uppercase;" required="true"
                           requiredMessage="RG e obrigatorio." disabled="#{not professorBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfessorDtNasc" value="#{professorBean.detalheEdicao.dtNasc}"
                           label="Data de Nascimento" type="date" converterPattern="yyyy-MM-dd"
                           converterMessage="Data invalida." styleClass="form-control" style="" required="true"
                           requiredMessage="Data de nascimento e obrigatoria."
                           disabled="#{not professorBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfessorEmail" value="#{professorBean.detalheEdicao.email}" label="Email"
                           type="email" styleClass="form-control" style=""
                           disabled="#{not professorBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfessorTelefone" value="#{professorBean.detalheEdicao.telefone}"
                           label="Telefone" styleClass="form-control" style="text-transform: uppercase;"
                           disabled="#{not professorBean.editandoDetalhe}"/>
        </h:panelGrid>
    </div>

    <div class="detail-actions">
        <p:commandButton value="Editar" rendered="#{not professorBean.editandoDetalhe}"
                         action="#{professorBean.habilitarEdicaoDetalhe}" update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Cancelar" rendered="#{professorBean.editandoDetalhe}"
                         action="#{professorBean.cancelarEdicaoDetalhe}" update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Salvar" rendered="#{professorBean.editandoDetalhe}"
                         action="#{professorBean.salvarDetalhe}" process="@form"
                         update=":growl @form :formListaProfessor:listaProfessores"
                         oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetalhes')).hide();}"
                         styleClass="btn-primaryx ui-button-outlined"
                         style="border-radius: 10px"/>
    </div>

</ui:composition>
