<!-- Trecho renderizado dentro do modal de detalhes para apresentar os dados do registro selecionado. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:cmp="jakarta.faces.composite/components"
                xmlns:p="http://primefaces.org/ui">

    <div class="detail-badge-row">
        <span class="badge-pill badge-muted">ID: #{profissionalBean.detalheProfissional.id}</span>
        <span class="badge-pill badge-muted">RM: #{profissionalBean.detalheProfissional.rm}</span>
    </div>

    <div class="field-group">
        <h:panelGrid columns="1" cellpadding="7">
            <cmp:baseInput id="detalheProfissionalNome"
                           value="#{profissionalBean.detalheEdicao.nome}"
                           label="Nome Completo"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="Nome e obrigatorio."
                           disabled="#{not profissionalBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfissionalCpf"
                           value="#{profissionalBean.detalheEdicao.cpf}"
                           label="CPF"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="CPF e obrigatorio."
                           disabled="#{not profissionalBean.editandoDetalhe}"
                           maxLength="14"
                           inputMode="numeric"
                           onInput="this.value = formatarCpf(this.value);"/>
            <cmp:baseInput id="detalheProfissionalRg"
                           value="#{profissionalBean.detalheEdicao.rg}"
                           label="RG"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="RG e obrigatorio."
                           disabled="#{not profissionalBean.editandoDetalhe}"
                           maxLength="12"
                           inputMode="numeric"
                           onInput="this.value = formatarRg(this.value);"/>
            <cmp:baseInput id="detalheProfissionalDtNasc" value="#{profissionalBean.detalheEdicao.dtNasc}"
                           label="Data de Nascimento" type="date" converterPattern="yyyy-MM-dd"
                           converterMessage="Data invalida." styleClass="form-control" style="" required="true"
                           requiredMessage="Data de nascimento e obrigatoria."
                           disabled="#{not profissionalBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfissionalEmail" value="#{profissionalBean.detalheEdicao.email}" label="Email"
                           type="email" styleClass="form-control" style=""
                           disabled="#{not profissionalBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheProfissionalTelefone"
                           value="#{profissionalBean.detalheEdicao.telefone}"
                           label="Telefone"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           disabled="#{not profissionalBean.editandoDetalhe}"
                           maxLength="14"
                           inputMode="numeric"
                           onInput="this.value = formatarTelefone(this.value);"/>
        </h:panelGrid>
    </div>

    <div class="detail-actions">
        <p:commandButton value="Editar" rendered="#{not profissionalBean.editandoDetalhe}"
                         action="#{profissionalBean.habilitarEdicaoDetalhe}" update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Cancelar" rendered="#{profissionalBean.editandoDetalhe}"
                         action="#{profissionalBean.cancelarEdicaoDetalhe}" update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Salvar" rendered="#{profissionalBean.editandoDetalhe}"
                         action="#{profissionalBean.salvarDetalhe}" process="@form"
                         update=":growl @form :formListaProfissional:listaProfissionais"
                         oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetalhes')).hide();}"
                         styleClass="btn-primaryx ui-button-outlined"
                         style="border-radius: 10px"/>
    </div>

</ui:composition>
