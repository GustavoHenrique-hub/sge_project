<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui"
                xmlns:cmp="jakarta.faces.composite/components">

    <h:form id="formPerfilUser">
        <div id="grid" class="modal-link-grid">
            <div class="modal-link-item">
                <cmp:baseAutocomplete
                        id="dropDownUsuarioModal"
                        label="Usuário"
                        value="#{perfilUsuarioBean.usuarioSelecionado}"
                        badgeValue="#{perfilUsuarioBean.usuarioSelecionado != null ? perfilUsuarioBean.usuarioSelecionado.id : null}"
                        completeMethod="#{usuarioBean.completeUsuario}"
                        converter="#{usuarioEntityConverter}"
                        itemLabelProperty="login"
                        parentDivStyle="modal-link-item"
                        childrenDivStyle="modal-id-inline"
                        required="false"
                        requiredMessage="Usuario e obrigatorio."/>
            </div>

            <div class="modal-link-item">
                <cmp:baseAutocomplete
                        id="dropDownPerfilModal"
                        label="Perfil"
                        value="#{perfilUsuarioBean.perfilSelecionado}"
                        badgeValue="#{perfilUsuarioBean.perfilSelecionado != null ? perfilUsuarioBean.perfilSelecionado.id : null}"
                        completeMethod="#{perfilBean.completePerfil}"
                        converter="#{perfilEntityConverter}"
                        itemLabelProperty="perfil"
                        parentDivStyle="modal-link-item"
                        childrenDivStyle="modal-id-inline"
                        required="false"
                        requiredMessage="Perfil e obrigatorio."/>
            </div>

            <div class="modal-link-item">
                <cmp:baseAutocomplete
                        id="dropDownSituacaoModal"
                        label="Situação"
                        value="#{perfilUsuarioBean.situacaoSelecionada}"
                        badgeValue="#{perfilUsuarioBean.situacaoSelecionada != null ? perfilUsuarioBean.situacaoSelecionada.id : null}"
                        completeMethod="#{situacaoBean.completeSituacao}"
                        converter="#{situacaoEntityConverter}"
                        itemLabelProperty="situacao"
                        parentDivStyle="modal-link-item"
                        childrenDivStyle="modal-id-inline"
                        required="true"
                        requiredMessage="Situacao e obrigatoria."/>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <p:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{perfilUsuarioBean.vincular}"
                             process="@form"
                             update=":growl :formLista:listaUsers @form"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPerfilUser')).hide();}"/>
        </div>

    </h:form>

</ui:composition>
