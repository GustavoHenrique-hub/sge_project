<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formNovaTurma">

        <p:messages id="msgsNovaTurma"
                    showSummary="true"
                    showDetail="true"
                    closable="true"
                    styleClass="mb-3"/>

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Nome da Turma</label>
                <h:inputText value="#{turmaBean.turmaDTO.turma}"
                             styleClass="form-control"
                             style="text-transform: uppercase;"
                             required="true"
                             requiredMessage="Nome e obrigatorio."
                             />
            </div>

            <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
                <!-- Fecha modal sem submit -->
                <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <!-- Submit do JSF -->
                <p:commandButton value="Salvar"
                                 styleClass="btn-primaryx"
                                 action="#{turmaBean.salvar}"
                                 process="@form"
                                 update=":growl :msgs :formListaTurma:listaTurmas @form msgsNovaTurma"
                                 oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNovaTurma')).hide();}" />
            </div>
        </div>
    </h:form>
</ui:composition>
