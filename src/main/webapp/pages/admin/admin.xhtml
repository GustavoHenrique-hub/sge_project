<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <ui:define name="title">Administração</ui:define>
    <ui:define name="subtitle">Perfis e usuários</ui:define>

    <ui:define name="content">
        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Usuários e perfis</div>
                    <div class="cardx-subtitle">Admin / Professor / Secretaria</div>
                </div>
                <div>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalPerfilUser">Novo vínculo
                    </button>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalNewUser">Novo usuário
                    </button>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-md-5">
                    <input class="form-control" placeholder="Buscar por nome/usuário..."/>
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option>Perfil (todos)</option>
                        <option>Admin</option>
                        <option>Professor</option>
                        <option>Secretaria</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn-ghostx" type="button">Filtrar</button>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn-ghostx" type="button">Limpar</button>
                </div>
            </div>
        </div>

        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Lista de usuários</div>
                    <div class="cardx-subtitle">Controle de acesso</div>
                </div>
            </div>
            <h:form>
                <p:dataTable class="table-modern" id="listaUsers" var="usuario" value="#{usuarioAdminBean.usuarios}"
                             rowKey="#{usuarioAdminBean.form.id}">
                    <p:column headerText="Login">
                        <h:outputText value="#{usuario.login}"/>
                    </p:column>
                    <p:column headerText="Usuário">
                        <h:outputText value="#{usuario.usuario}"/>
                    </p:column>
                    <p:column headerText="Situação">
                        <p:badge severity="#{usuario.situacao}" styleClass="badge-pill badge-muted"
                                 value="#{usuario.situacao}"/>
                    </p:column>
                    <p:column headerText="Perfil">
                        <p:badge severity="warning" styleClass="badge-pill badge-muted" value="#{usuario.perfil}"/>
                    </p:column>
                    <p:column headerText="Editar">
                        <h:commandButton styleClass="btn-ghostx" value="Editar"/>
                    </p:column>
                    <p:column headerText="Excluir">
                        <h:commandButton styleClass="btn-ghostx" value="Excluir"/>
                    </p:column>
                    <tbody>
                    <tr>
                        <td>admin</td>
                        <td>Administrador</td>
                        <td><span class="">Admin</span></td>
                        <td><span class="badge-pill badge-success">Ativo</span></td>
                        <td class="d-flex gap-2">
                            <button class="" type="button">Editar</button>
                            <button class="btn-ghostx" type="button">Desativar</button>
                        </td>
                    </tr>
                    </tbody>
                </p:dataTable>
            </h:form>
        </div>

        <!-- MODAL Novo Usuário -->
        <div class="modal fade"
             id="modalNewUser"
             tabindex="-1"
             aria-labelledby="modalNewUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content"
                     style="background: rgba(15,23,42,.92);
                                border: 1px solid rgba(255,255,255,.10);
                                border-radius: 16px;
                                backdrop-filter: blur(10px);">

                    <div class="modal-header"
                         style="border-bottom: 1px solid rgba(255,255,255,.10);">
                        <h5 class="modal-title" id="modalNewUserLabel" style="color: rgba(255,255,255,.92);">
                            Novo usuário
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <!-- ✅ inclui o conteúdo do arquivo separado -->
                        <ui:include src="/components/modal/newuser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL Vínculo Perfil x Usuário -->
        <div class="modal fade"
             id="modalPerfilUser"
             tabindex="-1"
             aria-labelledby="modalPerfilUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content"
                     style="background: rgba(15,23,42,.92);
                                border: 1px solid rgba(255,255,255,.10);
                                border-radius: 16px;
                                backdrop-filter: blur(10px);">

                    <div class="modal-header"
                         style="border-bottom: 1px solid rgba(255,255,255,.10);">
                        <h5 class="modal-title" id="modalPerfilUserLabel" style="color: rgba(255,255,255,.92);">
                            Novo usuário
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <!-- ✅ inclui o conteúdo do arquivo separado -->
                        <ui:include src="/components/modal/perfiluser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
