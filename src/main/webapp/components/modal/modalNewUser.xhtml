<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:cmp="jakarta.faces.composite/components"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formNewUser">
        <p:remoteCommand name="rcLimparNovoUsuario"
                         action="#{usuarioBean.limparFormulario}"
                         process="@this"
                         immediate="true"
                         update="@form"/>
        <div class="field-group">
            <h:panelGrid id="grid" columns="1" cellpadding="7">
                <cmp:baseInput id="inputLogin"
                               value="#{usuarioBean.form.login}"
                               styleClass="form-control"
                               style="text-transform: uppercase;"
                               required="true"
                               requiredMessage="Login é obrigatório!"
                               label="Login"/>

                <cmp:baseInput id="inputUsuario"
                               value="#{usuarioBean.form.usuario}"
                               styleClass="form-control"
                               style="text-transform: uppercase;"
                               required="true"
                               requiredMessage="Usuario é obrigatório!"
                               label="Usuario"/>

                <cmp:baseInput id="inputSenha"
                               value="#{usuarioBean.form.senha}"
                               styleClass="form-control"
                               style=""
                               secret="true"
                               required="true"
                               requiredMessage="Senha é obrigatória!"
                               label="Senha"/>

                <cmp:baseInput id="inputSessionTimeout"
                               value="#{usuarioBean.form.sessionTimeout}"
                               styleClass="form-control"
                               required="true"
                               requiredMessage="Tempo de Sessão é obrigatório!"
                               converterMessage="Tempo de Sessão é  deve ser um número inteiro!"
                               label="Tempo de Sessão"/>
            </h:panelGrid>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <cmp:baseButton styleClass="btn-ghostx"
                            onclick="rcLimparNovoUsuario()"
                            dataBsDismiss="modal"
                            buttonLabel="Cancelar"
                            parentDivStyle=""/>

            <p:commandButton value="Salvar"
                             styleClass="btn-primaryx ui-button-outlined"
                             style="border-radius: 10px"
                             action="#{usuarioBean.salvar}"
                             process="@form"
                             update=":growl :formLista:listaUsers @form grid"
                             oncomplete="if(!args.validationFailed){rcLimparNovoUsuario();bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNewUser')).hide();}" />
        </div>

    </h:form>

</ui:composition>
