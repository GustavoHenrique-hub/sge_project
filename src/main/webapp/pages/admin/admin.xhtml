<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Administração</ui:define>
    <ui:define name="subtitle">Perfis e usuários</ui:define>

    <ui:define name="content">
        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Usuários e perfis</div>
                    <div class="cardx-subtitle">Admin / Professor / Secretaria</div>
                </div>

            </div>
            <h:form id="formFiltros">
                <div class="filters-body">
                    <div class="filters-body-column">
                        <label class="form-label cardx-title">Usuário</label>
                        <div class="filters-body-column-row">
                            <h:outputText id="usuarioIdLabel" styleClass="form-label badge-pill-id badge-muted"
                                          value="#{perfilUsuarioBean.filtroUsuario != null ? 'ID: '.concat(perfilUsuarioBean.filtroUsuario.id) : 'ID: -'}"/>
                            <p:autoComplete id="dropDownUsuario" dropdown="true"
                                            value="#{perfilUsuarioBean.filtroUsuario}"
                                            styleClass="autocomplete-modern" inputStyleClass="autocomplete-input"
                                            var="usuario" itemLabel="#{usuario.login}"
                                            itemValue="#{usuario}" converter="#{usuarioEntityConverter}"
                                            completeMethod="#{perfilUsuarioBean.completeUsuario}" scrollHeight="250"
                                            forceSelection="true">
                                <p:ajax event="itemSelect" update="usuarioIdLabel"/>
                                <p:ajax event="clear" update="usuarioIdLabel"/>
                            </p:autoComplete>
                        </div>
                    </div>

                    <div class="filters-body-column">
                        <label class="form-label cardx-title">Perfil</label>
                        <div class="filters-body-column-row">
                            <h:outputText id="perfilIdLabel" styleClass="form-label badge-pill-id badge-muted"
                                          value="#{perfilUsuarioBean.filtroPerfil != null ? 'ID: '.concat(perfilUsuarioBean.filtroPerfil.id) : 'ID: -'}"/>
                            <p:autoComplete id="dropDownPerfil" dropdown="true"
                                            value="#{perfilUsuarioBean.filtroPerfil}"
                                            styleClass="autocomplete-modern" inputStyleClass="autocomplete-input"
                                            var="perfil" itemLabel="#{perfil.perfil}" itemValue="#{perfil}"
                                            converter="#{perfilEntityConverter}"
                                            completeMethod="#{perfilBean.completePerfil}" scrollHeight="250"
                                            forceSelection="true">
                                <p:ajax event="itemSelect" update="perfilIdLabel"/>
                                <p:ajax event="clear" update="perfilIdLabel"/>
                            </p:autoComplete>
                        </div>
                    </div>

                    <div class="filters-body-column">
                        <label class="form-label cardx-title">Situação</label>
                        <div class="filters-body-column-row">
                            <h:outputText id="situacaoIdLabel" styleClass="form-label badge-pill-id badge-muted"
                                          value="#{perfilUsuarioBean.filtroSituacao != null ? 'ID: '.concat(perfilUsuarioBean.filtroSituacao.id) : 'ID: -'}"/>
                            <p:autoComplete id="dropDownSituacao" dropdown="true"
                                            value="#{perfilUsuarioBean.filtroSituacao}"
                                            styleClass="autocomplete-modern" inputStyleClass="autocomplete-input"
                                            var="situacao" itemLabel="#{situacao.situacao}" itemValue="#{situacao}"
                                            converter="#{situacaoEntityConverter}"
                                            completeMethod="#{situacaoBean.completeSituacao}" scrollHeight="250"
                                            forceSelection="true">
                                <p:ajax event="itemSelect" update="situacaoIdLabel"/>
                                <p:ajax event="clear" update="situacaoIdLabel"/>
                            </p:autoComplete>
                        </div>

                    </div>
                    <div class="filters-body-button-column">
                        <h:commandButton styleClass="btn-ghostx" value="Filtrar" action="#{perfilUsuarioBean.filtrar}"
                                         update=":growl :formLista:listaUsers"/>
                    </div>

                </div>
            </h:form>
        </div>

        <div class="cardx-datatable">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Lista de usuários</div>
                    <div class="cardx-subtitle">Controle de acesso</div>
                </div>
                <div>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalPerfilUser">Novo vínculo
                    </button>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalNewUser">Novo usuário
                    </button>
                </div>
            </div>
            <div class="cardx-body">
                <div class="table-scroll">
                    <h:form id="formLista">
                        <h:dataTable styleClass="table-modern" id="listaUsers" var="usuario"
                                     value="#{perfilUsuarioBean.perfilUsuarios}"
                                     rowKey="#{perfilUsuarioBean.perfilUsuarioDTO.id}">
                            <h:column class="d-flex gap-2">
                                <f:facet name="header">Ações</f:facet>
                                <h:commandButton action="#{perfilUsuarioBean.inativarVinculo(usuario)}"
                                                 title="Inativar vínculo"
                                                 rendered="#{!perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                 styleClass="icon-action-btn icon-ban"
                                                 value="&#xe935;"
                                                 update=":formLista:listaUsers :growl">
                                    <!--                                    <f:ajax execute="@this" render=":formLista:listaUsers :growl"/>-->
                                </h:commandButton>
                                <h:commandButton action="#{perfilUsuarioBean.ativarVinculo(usuario)}"
                                                 title="Ativar vínculo"
                                                 rendered="#{perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                 styleClass="icon-action-btn icon-check"
                                                 value="&#xe909;"
                                                 update=":formLista:listaUsers :growl">
                                    <!--                                    <f:ajax execute="@this" render=":formLista:listaUsers :growl"/>-->
                                </h:commandButton>
                                <h:commandButton action="#{perfilUsuarioBean.excluirVinculo(usuario)}"
                                                 title="Excluir vínculo"
                                                 rendered="#{perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                 styleClass="icon-action-btn icon-trash"
                                                 value="&#xe93d;"
                                                 update=":formLista:listaUsers :growl">
                                    <!--                                    <f:ajax execute="@this" render=":formLista:listaUsers :growl"/>-->
                                </h:commandButton>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Usuário</f:facet>
                                <h:outputText value="#{usuario.usuario.usuario}"/>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Login</f:facet>
                                <h:outputText value="#{usuario.usuario.login}"/>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Perfil</f:facet>
                                <!--                                <p:badge severity="warning" styleClass="badge-pill badge-muted"-->
                                <!--                                         value="#{usuario.perfil != null ? usuario.perfil.perfil : '-'}" />-->
                                <span class="badge-pill badge-muted">#{usuario.perfil != null ? usuario.perfil.perfil : '-'}</span>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Situação</f:facet>
                                <!--                                <p:badge severity="#{perfilUsuarioBean.situacaoSeverity(usuario.situacao)}"-->
                                <!--                                         styleClass="#{perfilUsuarioBean.situacaoBadgeClass(usuario.situacao)}"-->
                                <!--                                         value="#{usuario.situacao}"/>-->

                                <span class="badge-pill #{perfilUsuarioBean.situacaoSeverity(usuario.situacao != null ? usuario.situacao.situacao : null)}">
                                    #{usuario.situacao != null ? usuario.situacao.situacao : '-'}
                                </span>
                            </h:column>
                        </h:dataTable>
                    </h:form>
                </div>
            </div>
        </div>

        <!-- MODAL Novo UsuÃ¡rio -->
        <div class="modal fade modal-modern"
             id="modalNewUser"
             tabindex="-1"
             aria-labelledby="modalNewUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-reference-size">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" id="modalNewUserLabel">
                            Novo usuário
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <!-- âœ… inclui o conteÃºdo do arquivo separado -->
                        <ui:include src="/components/modal/newuser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL Vínculo Perfil x Usuário -->
        <div class="modal fade modal-modern"
             id="modalPerfilUser"
             tabindex="-1"
             aria-labelledby="modalPerfilUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-reference-size">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" id="modalPerfilUserLabel">
                            Novo vínculo
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <ui:include src="/components/modal/perfiluser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
