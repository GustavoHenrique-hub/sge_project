<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>
        <ui:insert name="title">Sistema de Gestão Escolar</ui:insert>
    </title>

    <!-- Bootstrap 5 (via CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <!-- Fonte (opcional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"
          rel="stylesheet"/>
    <h:outputStylesheet library="primeicons" name="primeicons.css"/>

</h:head>

<h:body styleClass="#{themeBean.bodyClass}">
    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <div>
                    <div class="title">Gestão Escolar</div>
                    <div class="subtitle">
                        <ui:insert name="subtitle">Painel</ui:insert>
                    </div>
                </div>
            </div>

            <nav class="nav">
                <h:link outcome="/pages/alunos/dashboard.xhtml" styleClass="active">
                    Dashboard
                </h:link>
                <h:link outcome="/pages/alunos/alunos.xhtml">Alunos</h:link>
                <h:link outcome="/pages/professores/professores.xhtml">Professores</h:link>
                <h:link outcome="/pages/alunos/turmas.xhtml">Turmas</h:link>
                <h:link outcome="/pages/admin/matriculas.xhtml">Matrículas</h:link>
                <h:link outcome="/pages/alunos/nota-frequencia.xhtml">Notas &amp; Frequência</h:link>
                <h:link outcome="/pages/alunos/historico.xhtml">Histórico</h:link>
                <h:link outcome="/pages/admin/admin.xhtml">Administração</h:link>
            </nav>

            <div class="cardx" style="margin-top: 16px;">
                <div class="cardx-title">Seu perfil</div>
                <div class="cardx-subtitle">Ex.: Admin / Professor / Secretaria</div>
                <div style="margin-top: 10px;">
                    <h:link outcome="/login.xhtml" styleClass="btn-ghostx" value="Sair"/>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <!-- TOPBAR -->
            <div class="topbar">
                <div class="search">
                    <h:form>
                        <h:inputText value="#{layoutBean.search}"
                                     styleClass=""
                                     pt:placeholder="Buscar aluno, turma, professor..."
                                     xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/>
                    </h:form>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <span class="badge-pill badge-muted">Notificações</span>
                    <span class="badge-pill badge-muted">Gustavo</span>
                    <h:form styleClass="d-inline">
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-sun"
                                         title="Trocar para tema claro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{!themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-moon"
                                         title="Trocar para tema escuro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                    </h:form>
                </div>
            </div>

            <!-- CONTEÚDO -->
            <ui:insert name="content"/>
        </main>

    </div>

    <p:growl id="growl"
             globalOnly="true"
             showSummary="true"
             showDetail="true"
             life="3200"
             sticky="false" />

    <h:panelGroup id="msgs" layout="block" styleClass="jsf-msgs-hidden">
        <h:messages globalOnly="true" layout="list"
                    showSummary="true"
                    showDetail="true"
                    infoClass="jsf-msg jsf-info"
                    warnClass="jsf-msg jsf-warn"
                    errorClass="jsf-msg jsf-error"
                    fatalClass="jsf-msg jsf-fatal"/>
    </h:panelGroup>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" />

    <!-- Seu CSS -->
    <h:outputStylesheet library="css" name="app-v2.css" target="body"/>
</h:body>
</html>
