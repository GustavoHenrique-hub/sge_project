<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <ui:define name="title">Administração</ui:define>
    <ui:define name="subtitle">Perfis e usuários</ui:define>

    <ui:define name="content">
        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Usuários e perfis</div>
                    <div class="cardx-subtitle">Admin / Professor / Secretaria</div>
                </div>
                <div>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalPerfilUser">Novo vínculo
                    </button>
                    <button class="btn-primaryx"
                            type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#modalNewUser">Novo usuário
                    </button>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-md-5">
                    <input class="form-control" placeholder="Buscar por nome usuário..."/>
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option>Perfil (todos)</option>
                        <option>Admin</option>
                        <option>Professor</option>
                        <option>Secretaria</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn-ghostx" type="button">Filtrar</button>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn-ghostx" type="button">Limpar</button>
                </div>
            </div>
        </div>

        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Lista de usuários</div>
                    <div class="cardx-subtitle">Controle de acesso</div>
                </div>
            </div>
            <h:form>
                <h:dataTable styleClass="table-modern" id="listaUsers" var="usuario" value="#{perfilUsuarioBean.perfilUsuarios}"
                             rowKey="#{usuario.id}">
                    <h:column>
                        <f:facet name="header">Usuário</f:facet>
                        <h:outputText value="#{usuario.usuario.usuario}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Situação</f:facet>
                        <p:badge severity="#{perfilUsuarioBean.situacaoSeverity(usuario.situacao)}"
                                 styleClass="#{perfilUsuarioBean.situacaoBadgeClass(usuario.situacao)}"
                                 value="#{usuario.situacao}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Perfil</f:facet>
                        <p:badge severity="warning" styleClass="badge-pill badge-muted"
                                 value="#{usuario.acesso.nomeAcesso}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Editar</f:facet>
                        <h:commandButton styleClass="btn-ghostx" value="Editar"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Excluir</f:facet>
                        <h:commandButton styleClass="btn-ghostx" value="Excluir"/>
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>

        <!-- MODAL Novo UsuÃ¡rio -->
        <div class="modal fade"
             id="modalNewUser"
             tabindex="-1"
             aria-labelledby="modalNewUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content"
                     style="background: rgba(15,23,42,.92);
                                border: 1px solid rgba(255,255,255,.10);
                                border-radius: 16px;
                                backdrop-filter: blur(10px);">

                    <div class="modal-header"
                         style="border-bottom: 1px solid rgba(255,255,255,.10);">
                        <h5 class="modal-title" id="modalNewUserLabel" style="color: rgba(255,255,255,.92);">
                            Novo usuÃ¡rio
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <!-- âœ… inclui o conteÃºdo do arquivo separado -->
                        <ui:include src="/components/modal/newuser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL VÃ­nculo Perfil x UsuÃ¡rio -->
        <div class="modal fade"
             id="modalPerfilUser"
             tabindex="-1"
             aria-labelledby="modalPerfilUserLabel"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content"
                     style="background: rgba(15,23,42,.92);
                                border: 1px solid rgba(255,255,255,.10);
                                border-radius: 16px;
                                backdrop-filter: blur(10px);">

                    <div class="modal-header"
                         style="border-bottom: 1px solid rgba(255,255,255,.10);">
                        <h5 class="modal-title" id="modalPerfilUserLabel" style="color: rgba(255,255,255,.92);">
                            Novo usuÃ¡rio
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"/>
                    </div>

                    <div class="modal-body">
                        <!-- âœ… inclui o conteÃºdo do arquivo separado -->
                        <ui:include src="/components/modal/perfiluser.xhtml"/>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
