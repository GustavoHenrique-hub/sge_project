<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui"
                xmlns:cmp="jakarta.faces.composite/components">

    <h:form id="formAlunoTurma">
        <div id="grid" class="modal-link-grid">
            <cmp:baseAutocomplete id="dropDownAlunoModal"
                                  label="Aluno"
                                  value="#{alunoTurmaBean.filtroAluno}"
                                  badgeValue="#{alunoTurmaBean.filtroAluno != null ? alunoTurmaBean.filtroAluno.rm : null}"
                                  completeMethod="#{alunoBean.completeAluno}"
                                  converter="#{alunoEntityConverter}"
                                  itemLabelProperty="nome"
                                  parentDivStyle="modal-link-item"
                                  childrenDivStyle="modal-id-inline"
                                  required="false"
                                  requiredMessage="Aluno é obrigatório!"/>

            <cmp:baseAutocomplete id="dropDownTurmaModal"
                                  label="Turma"
                                  value="#{alunoTurmaBean.filtroTurma}"
                                  badgeValue="#{alunoTurmaBean.filtroTurma != null ? alunoTurmaBean.filtroTurma.codigo : null}"
                                  completeMethod="#{turmaBean.completeTurma}"
                                  converter="#{turmaEntityConverter}"
                                  itemLabelProperty="turma"
                                  parentDivStyle="modal-link-item"
                                  childrenDivStyle="modal-id-inline"
                                  required="false"
                                  requiredMessage="Turma é obrigatório!"/>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <p:commandButton value="Salvar"
                             styleClass="btn-primaryx ui-button-outlined"
                             style="border-radius: 10px"
                             action="#{alunoTurmaBean.confirmarPelosFiltros}"
                             process="@form"
                             update=":growl :formMatricula:listaMatriculas @form"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalMatricula')).hide();}"/>
        </div>

    </h:form>

</ui:composition>
