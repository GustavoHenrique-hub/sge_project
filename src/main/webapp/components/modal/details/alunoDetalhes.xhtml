<!-- Trecho renderizado dentro do modal de detalhes para apresentar os dados do registro selecionado. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:cmp="jakarta.faces.composite/components"
                xmlns:p="http://primefaces.org/ui">

    <div class="detail-badge-row">
        <span class="badge-pill badge-muted">ID: #{alunoBean.detalheSelecionado.id}</span>
        <span class="badge-pill badge-muted">RM: #{alunoBean.detalheSelecionado.rm}</span>
    </div>

    <div class="field-group">
        <h:panelGrid columns="1" cellpadding="7">
            <cmp:baseInput id="detalheAlunoNome"
                           value="#{alunoBean.detalheEdicao.nome}"
                           label="Nome Completo"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="Nome e obrigatorio."
                           disabled="#{not alunoBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheAlunoCpf"
                           value="#{alunoBean.detalheEdicao.cpf}"
                           label="CPF"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="CPF e obrigatorio."
                           disabled="#{not alunoBean.editandoDetalhe}"
                           maxLength="14"
                           inputMode="text"
                           onInput="this.value = formatarCpf(this.value);"/>
            <cmp:baseInput id="detalheAlunoRg"
                           value="#{alunoBean.detalheEdicao.rg}"
                           label="RG"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           required="true"
                           requiredMessage="RG e obrigatorio."
                           disabled="#{not alunoBean.editandoDetalhe}"
                           maxLength="12"
                           inputMode="numeric"
                           onInput="this.value = formatarRg(this.value);"/>
            <cmp:baseInput id="detalheAlunoDtNasc"
                           value="#{alunoBean.detalheEdicao.dtNasc}"
                           label="Data de Nascimento"
                           type="date"
                           converterPattern="yyyy-MM-dd"
                           converterMessage="Data invalida."
                           styleClass="form-control"
                           style="" required="true"
                           requiredMessage="Data de nascimento e obrigatoria."
                           disabled="#{not alunoBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheAlunoEmail"
                           value="#{alunoBean.detalheEdicao.email}"
                           label="Email"
                           type="email"
                           styleClass="form-control"
                           style=""
                           disabled="#{not alunoBean.editandoDetalhe}"/>
            <cmp:baseInput id="detalheAlunoTelefone"
                           value="#{alunoBean.detalheEdicao.telefone}"
                           label="Telefone"
                           styleClass="form-control"
                           style="text-transform: uppercase;"
                           disabled="#{not alunoBean.editandoDetalhe}"
                           maxLength="14"
                           inputMode="numeric"
                           onInput="this.value = formatarTelefone(this.value);"/>
        </h:panelGrid>
    </div>

    <div class="detail-actions">
        <p:commandButton value="Editar"
                         rendered="#{not alunoBean.editandoDetalhe}"
                         action="#{alunoBean.habilitarEdicaoDetalhe}"
                         update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Cancelar"
                         rendered="#{alunoBean.editandoDetalhe}"
                         action="#{alunoBean.cancelarEdicaoDetalhe}"
                         update="@form"
                         styleClass="btn-ghostx ui-button-outlined"
                         style="border-radius: 10px"/>
        <p:commandButton value="Salvar"
                         rendered="#{alunoBean.editandoDetalhe}"
                         action="#{alunoBean.salvarDetalhe}"
                         process="@form"
                         update=":growl @form :formListaAluno:listaAlunos"
                         oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetalhes')).hide();}"
                         styleClass="btn-primaryx ui-button-outlined"
                         style="border-radius: 10px"/>
    </div>

</ui:composition>
