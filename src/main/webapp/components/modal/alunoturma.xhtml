<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formAlunoTurma">

        <div class="modal-link-grid">
            <div class="modal-link-item">
                <label class="form-label cardx-title">Aluno</label>
                <div class="modal-id-inline">
                    <h:outputText id="alunoIdLabel" styleClass="form-label badge-pill-id badge-muted"
                                  value="#{alunoTurmaBean.filtroAluno != null ? alunoTurmaBean.filtroAluno.rm : null}"/>
                    <p:autoComplete id="dropDownAlunoModal" dropdown="true" value="#{alunoTurmaBean.filtroAluno}"
                                    styleClass="autocomplete-modern" inputStyleClass="autocomplete-input"
                                    var="aluno" itemLabel="#{aluno.nome}"
                                    itemValue="#{aluno}" converter="#{alunoEntityConverter}"
                                    completeMethod="#{alunoTurmaBean.completeAluno}"
                                    scrollHeight="250" forceSelection="true" appendTo="@(body)">
                        <p:ajax event="itemSelect" update="alunoIdLabel"/>
                        <p:ajax event="clear" update="alunoIdLabel"/>
                    </p:autoComplete>
                </div>
            </div>

            <div class="modal-link-item">
                <label class="form-label cardx-title">Turma</label>
                <div class="modal-id-inline">
                    <h:outputText id="turmaIdLabel" styleClass="form-label badge-pill-id badge-muted"
                                  value="#{alunoTurmaBean.filtroTurma != null ? alunoTurmaBean.filtroTurma.id : null}"/>
                    <p:autoComplete id="dropDownTurmaModal" dropdown="true" value="#{alunoTurmaBean.filtroTurma}"
                                    styleClass="autocomplete-modern" inputStyleClass="autocomplete-input"
                                    var="turma" itemLabel="#{turma.turma}" itemValue="#{turma}"
                                    converter="#{turmaEntityConverter}"
                                    completeMethod="#{alunoTurmaBean.completeTurma}" scrollHeight="250"
                                    forceSelection="true" appendTo="@(body)">
                        <p:ajax event="itemSelect" update="turmaIdLabel"/>
                        <p:ajax event="clear" update="turmaIdLabel"/>
                    </p:autoComplete>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <h:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{alunoTurmaBean.confirmarPelosFiltros}"
                             process="@form"
                             update=":growl :formAlunoTurma :formListaAluno:listaAlunos"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAlunoTurma')).hide();}"/>
        </div>

    </h:form>

</ui:composition>
