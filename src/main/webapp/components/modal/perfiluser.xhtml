<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <h:form id="formPerfilUser">

        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Login</label>
                <h:inputText value="#{perfilUsuarioBean.perfilUsuarioDTO.usuario}"
                             styleClass="form-control"
                             pt:placeholder="ex: admin"/>
            </div>
            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Acesso</label>
                <h:selectOneMenu value="#{perfilUsuarioBean.perfilUsuarioDTO.acesso}" styleClass="form-select">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                    <f:selectItem itemLabel="Admin" itemValue="ADMIN"/>
                    <f:selectItem itemLabel="Professor" itemValue="PROFESSOR"/>
                    <f:selectItem itemLabel="Secretaria" itemValue="SECRETARIA"/>
                </h:selectOneMenu>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <h:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{perfilUsuarioBean.vincular}" />
        </div>

    </h:form>

</ui:composition>
