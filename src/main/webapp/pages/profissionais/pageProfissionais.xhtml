<!-- Tela principal deste modulo, com blocos visuais e componentes ligados aos beans JSF. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:cmp="jakarta.faces.composite/components"
                template="/template.xhtml">

    <ui:define name="title">Profissionais</ui:define>
    <ui:define name="subtitle">Profissionais / Cadastro</ui:define>

    <!-- Area principal da tela onde os componentes visuais e os dados do bean sao montados. -->
    <ui:define name="content">
        <!-- Card visual usado para separar blocos de informacao, formularios ou tabelas na tela. -->
        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Cadastro de profissionais</div>
                    <div class="cardx-subtitle">Filtros e consulta por docente</div>
                </div>
            </div>

            <!-- Formulario JSF que agrupa os campos enviados ao backend nesta parte da pagina. -->
            <h:form id="formFiltrosProfissional">
                <div class="filters-body">
                    <cmp:baseAutocomplete id="dropDownNomeProfissional"
                                          label="Nome"
                                          value="#{profissionalBean.filtroProfissional}"
                                          badgeValue="#{profissionalBean.filtroProfissional != null ? profissionalBean.filtroProfissional.rm : null}"
                                          completeMethod="#{profissionalBean.completeProfissionalBuscaGeral}"
                                          converter="#{profissionalEntityConverter}"
                                          itemLabelProperty="nome"
                                          parentDivStyle="filters-body-column"
                                          childrenDivStyle="filters-body-column-row"
                                          showMessage="false"
                                          required="false"
                                          fieldStyle="field-filters-autocomplete-wrap"
                                          placeholder="Busque por nome, RM ou CPF">
                        <p:column><h:outputText value="Nome: #{item.nome}"/></p:column>
                        <p:column><h:outputText value="RM: #{item.rm}"/></p:column>
                        <p:column><h:outputText value="CPF: #{profissionalBean.formatarCpf(item.cpf)}"/></p:column>
                    </cmp:baseAutocomplete>

                    <cmp:baseCommandButton value="Filtrar"
                                           action="#{profissionalBean.filtrar}"
                                           render=":growl :formListaProfissional:listaProfissionais"/>

                    <cmp:baseButton dataBsToggle="modal"
                                    styleClass="btn-primaryx"
                                    dataBsTarget="#modalNovoProfissional"
                                    buttonLabel="Cadastrar Profissional"
                                    parentDivStyle="filters-body-button-column"/>
                </div>
            </h:form>
        </div>

        <!-- Card visual usado para separar blocos de informacao, formularios ou tabelas na tela. -->
        <div class="cardx-datatable">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Lista de profissionais</div>
                    <div class="cardx-subtitle">Submodulo de consulta</div>
                </div>
            </div>
            <div class="cardx-body">
                <div class="table-scroll">
                    <!-- Formulario JSF que agrupa os campos enviados ao backend nesta parte da pagina. -->
                    <h:form id="formListaProfissional">
                        <h:dataTable styleClass="table-modern" id="listaProfissionais" var="profissionais"
                                     value="#{profissionalBean.profissionais}" rowKey="#{profissionais.id}">
                            <h:column class="d-flex gap-2">
                                <f:facet name="header">Acoes</f:facet>
                                <cmp:baseIconButton id="detalharProfissional"
                                                    action="#{profissionalBean.detalhar(profissionais)}"
                                                    title="Detalhar"
                                                    styleClass="icon-action-btn"
                                                    ajax="true"
                                                    render=":modalDetalhesWrapper"
                                                    value="&#xe908;"/>
                            </h:column>
                            <h:column><f:facet name="header">Nome</f:facet><h:outputText value="#{profissionais.nome}"/></h:column>
                            <h:column><f:facet name="header">RM</f:facet><h:outputText value="#{profissionais.rm}"/></h:column>
                            <h:column><f:facet name="header">CPF</f:facet><h:outputText value="#{profissionalBean.formatarCpf(profissionais.cpf)}"/></h:column>
                            <h:column><f:facet name="header">RG</f:facet><h:outputText value="#{profissionais.rg}"/></h:column>
                            <h:column><f:facet name="header">Email</f:facet><h:outputText value="#{profissionais.email}"/></h:column>
                            <h:column><f:facet name="header">Telefone</f:facet><h:outputText value="#{profissionais.telefone}"/></h:column>
                        </h:dataTable>
                    </h:form>
                </div>
            </div>
        </div>

        <cmp:baseModal modalId="modalNovoProfissional"
                       labelledby="modalNovoProfissionalLabel"
                       modalTitle="Cadastrar Profissional"
                       modalTitleId="modalNovoProfissionalLabel"
                       modalImport="modalNewProfissional.xhtml"/>
        <h:panelGroup id="modalDetalhesWrapper" layout="block">
            <cmp:baseModal modalId="modalDetalhes"
                           labelledby="modalDetalhesLabel"
                           modalTitle="#{detalheModalBean.titulo}"
                           modalTitleId="modalDetalhesLabel"
                           modalImport="modalDetalhes.xhtml"/>
        </h:panelGroup>

    </ui:define>
</ui:composition>
