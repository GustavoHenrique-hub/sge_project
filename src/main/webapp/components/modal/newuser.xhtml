<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formNewUser">

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Login</label>
                <h:inputText value="#{usuarioBean.form.login}"
                             styleClass="form-control"
                             style="text-transform: uppercase;"
                             />
            </div>

            <div class="col-md-4">
                <label class="form-label">Usuário</label>
                <h:inputText value="#{usuarioBean.form.usuario}"
                             styleClass="form-control"
                             style="text-transform: uppercase;"
                             />
            </div>

            <div class="col-md-4">
                <label class="form-label">Senha</label>
                <h:inputSecret value="#{usuarioBean.form.senha}"
                               styleClass="form-control"
                               />
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <h:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{usuarioBean.salvar}"
                             process="@form"
                             update=":growl :formNewUser"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNewUser')).hide();}" />
        </div>

    </h:form>

</ui:composition>
