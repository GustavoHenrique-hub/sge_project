<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - Gestão Escolar</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"
          rel="stylesheet"/>

    <h:outputStylesheet library="primeicons" name="primeicons.css"/>
    <h:outputStylesheet library="css" name="app-v2.css"/>
</h:head>

<h:body styleClass="#{themeBean.bodyClass}">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="cardx" style="max-width: 460px; width: 100%;">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Entrar</div>
                    <div class="cardx-subtitle">Acesse com seu perfil</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge-pill badge-muted">v1</span>
                    <h:form styleClass="d-inline">
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-sun"
                                         title="Trocar para tema claro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{!themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-moon"
                                         title="Trocar para tema escuro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                    </h:form>
                </div>
            </div>

            <h:form>
                <div class="mb-3">
                    <label class="form-label cardx-title">Usuário</label>
                    <h:inputText value="#{authBean.username}"
                                 styleClass="form-control"
                                 pt:placeholder="ex: gustavo"
                                 xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/>
                </div>

                <div class="mb-3">
                    <label class="form-label cardx-title">Senha</label>
                    <h:inputSecret value="#{authBean.password}"
                                   styleClass="form-control"
                                   pt:placeholder="••••••••"
                                   xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/>
                </div>

                <div class="d-grid gap-2">
                    <h:commandButton value="Entrar"
                                     styleClass="btn-primaryx"
                                     action="#{authBean.login}"/>
                    <button type="button" class="btn-ghostx">Esqueci a senha</button>
                </div>

                <div class="mt-3">
                    <span class="badge-pill badge-muted">Admin</span>
                    <span class="badge-pill badge-muted">Professor</span>
                    <span class="badge-pill badge-muted">Secretaria</span>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
