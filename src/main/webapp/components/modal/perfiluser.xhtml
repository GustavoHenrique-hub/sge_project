<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formPerfilUser">

        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Login</label>
                <h:selectOneMenu value="#{perfilUsuarioBean.usuarioId}" styleClass="form-select">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{usuarioAdminBean.usuarios}" var="usuario"
                                   itemLabel="ID: #{usuario.id} | Login: #{usuario.login}" itemValue="#{usuario.id}"/>
                </h:selectOneMenu>
            </div>
            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Acesso</label>
                <h:selectOneMenu value="#{perfilUsuarioBean.perfilId}" styleClass="form-select">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{perfilBean.perfils}" var="perfil"
                                   itemLabel="#{perfil.perfil}" itemValue="#{perfil.id}"/>
                </h:selectOneMenu>
            </div>
        </div>
        <div class="col-md-4">
            <label class="form-label" style="color: rgba(255,255,255,.70);">Acesso</label>
            <h:selectOneMenu value="#{perfilUsuarioBean.situacaoId}" styleClass="form-select">
                <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                <f:selectItems value="#{situacaoBean.situacao}" var="situacao"
                               itemLabel="ID: #{situacao.id} | #{situacao.situacao}" itemValue="#{situacao.id}"/>
            </h:selectOneMenu>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <h:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{perfilUsuarioBean.vincular}"
                             process="@form"
                             update=":growl :formPerfilUser"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNewUser')).hide();}" />
        </div>

    </h:form>

</ui:composition>
