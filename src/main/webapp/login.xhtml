<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - Gestao Escolar</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"
          rel="stylesheet"/>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232563eb'/%3E%3Cpath d='M20 22h24v6H20zm0 10h24v6H20zm0 10h16v6H20z' fill='white'/%3E%3C/svg%3E"/>

    <h:outputStylesheet library="primeicons" name="primeicons.css"/>
    <h:outputStylesheet library="css" name="app-v2.css"/>
</h:head>

<h:body styleClass="#{themeBean.bodyClass}">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="cardx" style="max-width: 460px; width: 100%;">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Entrar</div>
                    <div class="cardx-subtitle">Acesse com seu perfil</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge-pill badge-muted">v1</span>
                    <h:form styleClass="d-inline">
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-sun"
                                         title="Trocar para tema claro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                        <p:commandButton action="#{themeBean.toggleTheme}"
                                         rendered="#{!themeBean.darkTheme}"
                                         ajax="false"
                                         icon="pi pi-moon"
                                         title="Trocar para tema escuro"
                                         styleClass="btn-ghostx theme-toggle rounded-button ui-button-outlined"/>
                    </h:form>
                </div>
            </div>

            <h:form id="formLogin">
                <p:growl id="growl"
                         showSummary="true"
                         showDetail="true"
                         life="3200"
                         sticky="false"
                         redisplay="true"
                         styleClass="mb-3"/>

                <div class="mb-3">
                    <label class="form-label cardx-title" for="formLogin:username">Login</label>
                    <h:inputText id="username"
                                 value="#{authBean.username}"
                                 required="true"
                                 requiredMessage="Usuario e obrigatorio."
                                 styleClass="form-control"
                                 pt:placeholder="CPF sem pontuacao"/>
                </div>

                <div class="mb-3">
                    <label class="form-label cardx-title" for="formLogin:password">Senha</label>
                    <h:inputSecret id="password"
                                   value="#{authBean.password}"
                                   required="true"
                                   requiredMessage="Senha e obrigatoria."
                                   styleClass="form-control"
                                   pt:placeholder="........"/>
                </div>

                <div class="d-grid gap-2">
                    <h:commandButton value="Entrar"
                                     styleClass="btn-primaryx"
                                     process="@form"
                                     ajax="false"
                                     action="#{authBean.login}"/>
                </div>

                <div class="mt-3">
                    <span class="badge-pill badge-muted">Admin</span>
                    <span class="badge-pill badge-muted">Profissional</span>
                    <span class="badge-pill badge-muted">Secretaria</span>
                </div>
            </h:form>
        </div>
    </div>

    <div id="pageLoader" class="app-loader-backdrop" aria-hidden="true">
        <div class="app-loader-card">
            <i class="pi pi-spin pi-spinner app-loader-icon"></i>
            <span>Carregando...</span>
        </div>
    </div>

    <p:ajaxStatus onstart="window.AppLoader &amp;&amp; AppLoader.show()"
                  onsuccess="window.AppLoader &amp;&amp; AppLoader.hide()"
                  onerror="window.AppLoader &amp;&amp; AppLoader.hide()"/>

    <script>
        //<![CDATA[
        (function () {
            var loaderEl = null;
            var pending = 0;

            function ensureEl() {
                if (!loaderEl) {
                    loaderEl = document.getElementById("pageLoader");
                }
                return loaderEl;
            }

            function showLoader() {
                var el = ensureEl();
                if (!el) {
                    return;
                }
                pending++;
                el.classList.add("is-visible");
            }

            function hideLoader() {
                var el = ensureEl();
                if (!el) {
                    return;
                }
                pending = Math.max(0, pending - 1);
                if (pending === 0) {
                    el.classList.remove("is-visible");
                }
            }

            function shouldIgnoreTrigger(target) {
                if (!target) {
                    return true;
                }
                if (target.closest("[data-no-loader='true']")) {
                    return true;
                }
                if (target.tagName === "BUTTON") {
                    var type = (target.getAttribute("type") || "submit").toLowerCase();
                    if (type === "button") {
                        return true;
                    }
                }
                return false;
            }

            window.AppLoader = {
                show: showLoader,
                hide: hideLoader
            };

            document.addEventListener("click", function (event) {
                var trigger = event.target.closest("a[href], button, input[type='submit']");
                if (!trigger || shouldIgnoreTrigger(trigger)) {
                    return;
                }
                showLoader();
            }, true);

            window.addEventListener("beforeunload", showLoader);
            window.addEventListener("pageshow", function () {
                pending = 0;
                hideLoader();
            });
        })();
        //]]>
    </script>
</h:body>
</html>
