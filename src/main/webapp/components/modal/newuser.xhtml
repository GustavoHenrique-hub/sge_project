<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formNewUser">
        <div class="field-group">
            <h:panelGrid id="grid" columns="3" cellpadding="7">
                <div class="field-group">
                    <label class="form-label">Login</label>
                    <h:inputText value="#{usuarioBean.form.login}"
                                 styleClass="form-control"
                                 style="text-transform: uppercase;"
                                 required="true"
                                 requiredMessage="Login e obrigatorio."
                    />
                    <p:message for="@previous"/>
                </div>

                <div class="field-group">
                    <label class="form-label">Usuário</label>
                    <h:inputText value="#{usuarioBean.form.usuario}"
                                 styleClass="form-control"
                                 style="text-transform: uppercase;"
                                 required="true"
                                 requiredMessage="Usuario e obrigatorio."
                    />
                    <p:message for="@previous"/>
                </div>

                <div class="field-group">
                    <label class="form-label">Senha</label>
                    <h:inputSecret value="#{usuarioBean.form.senha}"
                                   styleClass="form-control"
                                   required="true"
                                   requiredMessage="Senha e obrigatoria."
                    />
                    <p:message for="@previous"/>
                </div>
            </h:panelGrid>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <p:commandButton value="Salvar"
                             styleClass="btn-primaryx ui-button-outlined"
                             style="border-radius: 10px"
                             action="#{usuarioBean.salvar}"
                             process="@form"
                             update=":growl :formLista:listaUsers @form grid"
                             oncomplete="if(!args.validationFailed){bootstrap.Modal.getOrCreateInstance(document.getElementById('modalNewUser')).hide();}" />
        </div>

    </h:form>

</ui:composition>
