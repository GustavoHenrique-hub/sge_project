<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <h:form id="formNewUser">

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Login</label>
                <h:inputText value="#{usuarioAdminBean.form.login}"
                             styleClass="form-control"
                             pt:placeholder="ex: admin"/>
            </div>

            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Usuário</label>
                <h:inputText value="#{usuarioAdminBean.form.usuario}"
                             styleClass="form-control"
                             pt:placeholder="Nome do usuário"/>
            </div>

            <div class="col-md-4">
                <label class="form-label" style="color: rgba(255,255,255,.70);">Senha</label>
                <h:inputSecret value="#{usuarioAdminBean.form.senha}"
                               styleClass="form-control"
                               pt:placeholder="••••••••"/>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2" style="margin-top: 18px;">
            <!-- Fecha modal sem submit -->
            <button type="button" class="btn-ghostx" data-bs-dismiss="modal">
                Cancelar
            </button>

            <!-- Submit do JSF -->
            <h:commandButton value="Salvar"
                             styleClass="btn-primaryx"
                             action="#{usuarioAdminBean.salvar}" />
        </div>

    </h:form>

</ui:composition>
