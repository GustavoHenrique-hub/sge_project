<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>
        <ui:insert name="title">Sistema de Gestão Escolar</ui:insert>
    </title>

    <!-- Bootstrap 5 (via CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <!-- Fonte (opcional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"
          rel="stylesheet"/>

    <!-- Seu CSS -->
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>

<h:body>
    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <div>
                    <div class="title">Gestão Escolar</div>
                    <div class="subtitle">
                        <ui:insert name="subtitle">Painel</ui:insert>
                    </div>
                </div>
            </div>

            <nav class="nav">
                <h:link outcome="/pages/dashboard.xhtml" styleClass="active">
                    Dashboard
                </h:link>
                <h:link outcome="/pages/alunos.xhtml">Alunos</h:link>
                <h:link outcome="/pages/professores.xhtml">Professores</h:link>
                <h:link outcome="/pages/turmas.xhtml">Turmas</h:link>
                <h:link outcome="/pages/matriculas.xhtml">Matrículas</h:link>
                <h:link outcome="/pages/notas-frequencia.xhtml">Notas &amp; Frequência</h:link>
                <h:link outcome="/pages/historico.xhtml">Histórico</h:link>
                <h:link outcome="/pages/admin.xhtml">Administração</h:link>
            </nav>

            <div class="cardx" style="margin-top: 16px;">
                <div class="cardx-title">Seu perfil</div>
                <div class="cardx-subtitle">Ex.: Admin / Professor / Secretaria</div>
                <div style="margin-top: 10px;">
                    <h:link outcome="/login.xhtml" styleClass="btn-ghostx" value="Sair"/>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <!-- TOPBAR -->
            <div class="topbar">
                <div class="search">
                    <h:form>
                        <h:inputText value="#{layoutBean.search}"
                                     styleClass=""
                                     pt:placeholder="Buscar aluno, turma, professor..."
                                     xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/>
                    </h:form>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <span class="badge-pill badge-muted">Notificações</span>
                    <span class="badge-pill badge-muted">Gustavo</span>
                </div>
            </div>

            <!-- CONTEÚDO -->
            <ui:insert name="content"/>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
