<!-- Tela principal deste modulo, com blocos visuais e componentes ligados aos beans JSF. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:cmp="jakarta.faces.composite/components"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Administração</ui:define>
    <ui:define name="subtitle">Perfis e usuários</ui:define>

    <!-- Area principal da tela onde os componentes visuais e os dados do bean sao montados. -->
    <ui:define name="content">
        <!-- Card visual usado para separar blocos de informacao, formularios ou tabelas na tela. -->
        <div class="cardx">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Usuários e perfis</div>
                    <div class="cardx-subtitle">Admin / Profissional / Secretaria</div>
                </div>

            </div>
            <!-- Formulario JSF que agrupa os campos enviados ao backend nesta parte da pagina. -->
            <h:form id="formFiltros">
                <div class="filters-body">
                    <cmp:baseAutocomplete id="dropDownProfissional"
                                          label="Profissional"
                                          value="#{perfilUsuarioBean.filtroProfissional}"
                                          badgeValue="#{perfilUsuarioBean.filtroProfissional != null ? perfilUsuarioBean.filtroProfissional.rm : null}"
                                          completeMethod="#{usuarioBean.completeProfissionalUsuario}"
                                          converter="#{profissionalEntityConverter}"
                                          itemLabelProperty="nome"
                                          parentDivStyle="filters-body-column"
                                          childrenDivStyle="filters-body-column-row"
                                          showMessage="false"
                                          required="false"
                                          fieldStyle="field-filters-autocomplete-wrap"
                                          placeholder="Busque por nome, RM ou CPF">
                    <p:column><h:outputText value="Nome: #{item.nome}"/></p:column>
                    <p:column><h:outputText value="RM: #{item.rm}"/></p:column>
                    <p:column><h:outputText value="CPF: #{profissionalBean.formatarCpf(item.cpf)}"/></p:column>
                    </cmp:baseAutocomplete>

                    <cmp:baseAutocomplete
                            id="dropDownPerfil"
                            label="Perfil"
                            value="#{perfilUsuarioBean.filtroPerfil}"
                            badgeValue="#{perfilUsuarioBean.filtroPerfil != null ? perfilUsuarioBean.filtroPerfil.id : null}"
                            completeMethod="#{perfilBean.completePerfil}"
                            converter="#{perfilEntityConverter}"
                            itemLabelProperty="perfil"
                            showMessage="false"
                            required="false"
                            fieldStyle="field-filters-autocomplete-wrap"/>

                    <cmp:baseAutocomplete
                            id="dropDownSituacao"
                            label="Situação"
                            value="#{perfilUsuarioBean.filtroSituacao}"
                            badgeValue="#{perfilUsuarioBean.filtroSituacao != null ? perfilUsuarioBean.filtroSituacao.id : null}"
                            completeMethod="#{situacaoBean.completeSituacao}"
                            converter="#{situacaoEntityConverter}"
                            itemLabelProperty="situacao"
                            showMessage="false"
                            required="false"
                            fieldStyle="field-filters-autocomplete-wrap"/>
                    <cmp:baseCommandButton value="Filtrar"
                                           action="#{perfilUsuarioBean.filtrar}"
                                           render=":growl :formLista:listaUsers"/>
                </div>
            </h:form>
        </div>

        <!-- Card visual usado para separar blocos de informacao, formularios ou tabelas na tela. -->
        <div class="cardx-datatable">
            <div class="cardx-header">
                <div>
                    <div class="cardx-title">Lista de usuários</div>
                    <div class="cardx-subtitle">Controle de acesso</div>
                </div>
                <div class="d-flex gap-2">
                    <cmp:baseButton dataBsToggle="modal"
                                    dataBsTarget="#modalPerfilUser"
                                    buttonLabel="Novo vínculo"
                                    parentDivStyle=""/>
                    <cmp:baseButton dataBsToggle="modal"
                                    dataBsTarget="#modalNewUser"
                                    buttonLabel="Novo usuário"
                                    parentDivStyle=""/>
                </div>
            </div>
            <div class="cardx-body">
                <div class="table-scroll">
                    <!-- Formulario JSF que agrupa os campos enviados ao backend nesta parte da pagina. -->
                    <h:form id="formLista">
                        <h:dataTable styleClass="table-modern" id="listaUsers" var="usuario"
                                     value="#{perfilUsuarioBean.perfilUsuarios}"
                                     rowKey="#{usuario.id}">
                            <h:column class="d-flex gap-2">
                                <f:facet name="header">Ações</f:facet>

                                <cmp:baseIconButton id="inativarVinculo"
                                                    action="#{perfilUsuarioBean.inativarVinculo(usuario)}"
                                                    title="Inativar vínculo"
                                                    styleclass="icon-action-btn icon-ban"
                                                    rendered="#{!perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                    ajax="true"
                                                    value="&#xe935;"
                                                    update=":formLista :growl" />
                                <cmp:baseIconButton id="ativarVinculo"
                                                    action="#{perfilUsuarioBean.ativarVinculo(usuario)}"
                                                    title="Ativar vínculo"
                                                    styleclass="icon-action-btn icon-check"
                                                    rendered="#{perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                    ajax="true"
                                                    value="&#xe909;"
                                                    update=":formLista :growl" />
                                <cmp:baseIconButton id="excluirVinculo"
                                                    action="#{perfilUsuarioBean.excluirVinculo(usuario)}"
                                                    title="Excluir vínculo"
                                                    styleclass="icon-action-btn icon-trash"
                                                    rendered="#{perfilUsuarioBean.isSituacaoInativa(usuario)}"
                                                    ajax="true"
                                                    value="&#xe93d;"
                                                    update=":formLista :growl" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Profissional</f:facet>
                                <h:outputText value="#{usuario.usuario.profissional != null ? usuario.usuario.profissional.nome : '-'}"/>
                            </h:column>
                            <h:column>
                                <f:facet name="header">RM</f:facet>
                                <h:outputText value="#{usuario.usuario.profissional != null ? usuario.usuario.profissional.rm : '-'}"/>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Login</f:facet>
                                <h:outputText value="#{usuario.usuario.login}"/>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Perfil</f:facet>
                                <span class="badge-pill badge-muted">#{usuario.perfil != null ? usuario.perfil.perfil : '-'}</span>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Situação</f:facet>
                                <span class="badge-pill #{perfilUsuarioBean.situacaoSeverity(usuario.situacao != null ? usuario.situacao.situacao : null)}">
                                    #{usuario.situacao != null ? usuario.situacao.situacao : '-'}
                                </span>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Tempo de Sessão</f:facet>
                                <h:outputText value="#{usuario.usuario.sessionTimeout}:00"/>
                            </h:column>
                        </h:dataTable>
                    </h:form>
                </div>
            </div>
        </div>

        <cmp:baseModal
                modalId="modalNewUser"
                labelledby="modalNewUserLabel"
                modalTitle="Novo usuário"
                modalTitleId="modalNewUserLabel"
                modalImport="modalNewUser.xhtml"/>

        <cmp:baseModal
                modalId="modalPerfilUser"
                labelledby="modalPerfilUserLabel"
                modalTitle="Novo vínculo"
                modalTitleId="modalPerfilUserLabel"
                modalImport="modalPerfilUser.xhtml"/>
    </ui:define>
</ui:composition>
